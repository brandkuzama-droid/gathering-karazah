<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>طلب سفرة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Noto+Sans+Arabic:wght@400;500;700;800&display=swap">
<style>
/* Layout: 3 steps (السفرة ← الأصناف ← البيانات), sticky action bar at bottom */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --fg:#2A1414; --muted:#7A6666;
  --line:#EBDDDD; --accent:#801919; --accent-fg:#FFFFFF; --soft:#F8EEEE; --warn:#C0392B;
  --display:"Tajawal","Noto Sans Arabic",Tahoma,sans-serif;
  --body:"Tajawal","Noto Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:720px;margin:0 auto;padding-block:20px 140px}
.top{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.steps{display:flex;gap:6px;flex:1}
.steps span{flex:1;height:4px;border-radius:4px;background:var(--line)}
.steps span.on{background:var(--accent)}
.langs{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;flex-shrink:0}
.langs button{background:none;border:0;border-radius:999px;padding:5px 12px;font:600 .85rem var(--body);color:var(--muted);cursor:pointer;white-space:nowrap}
.langs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
header{display:flex;flex-direction:column;gap:4px;margin-bottom:20px}
h1{font-family:var(--display);font-weight:800;font-size:1.9rem;margin:0;line-height:1.25;text-wrap:balance}
h2{font-family:var(--display);font-weight:700;font-size:1.3rem;margin:0}
.sub{color:var(--muted);margin:0}

/* السفر */
.sufras{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.sufra{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:18px;cursor:pointer;
  display:flex;flex-direction:column;gap:6px;text-align:start;font:inherit;color:inherit}
.sufra.on{border-color:var(--accent);background:var(--soft)}
.sufra .t{font-family:var(--display);font-weight:800;font-size:1.35rem;color:var(--accent)}
.sufra .ppl{font-weight:700}
.sufra .rule{color:var(--muted);font-size:.875rem}
.sufra .pr{font-weight:800;font-size:1.15rem;font-variant-numeric:tabular-nums;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px}
.old{color:var(--muted);font-weight:400;font-size:.85em;text-decoration:line-through}
.badge{font-size:.75rem;font-weight:700;background:var(--accent);color:var(--accent-fg);border-radius:999px;padding:1px 8px;align-self:flex-start}
.dish .ex{padding:0 10px 10px;margin-top:-6px;font-size:.82rem;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.summary .row.total{border-top:1px solid var(--line);padding-top:8px;font-weight:800;font-size:1.1rem}
.summary .row.total .k{color:var(--fg)}

/* الأصناف */
.cat{margin-top:26px}
.cat-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.pill{font-size:.8rem;padding:2px 10px;border-radius:999px;background:var(--soft);color:var(--accent);font-weight:700;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.full{background:var(--accent);color:var(--accent-fg)}
.dishes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.dish{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:0;overflow:hidden;cursor:pointer;
  font:inherit;color:inherit;text-align:start;display:flex;flex-direction:column;position:relative}
.dish.on{border-color:var(--accent)}
.dish.off{opacity:.45}
.dish .img{aspect-ratio:4/3;width:100%;max-width:100%;object-fit:cover;background:var(--soft);display:grid;place-items:center;
  font-family:var(--display);font-weight:800;font-size:1.8rem;color:var(--accent)}
.dish .n{padding:8px 10px 10px;font-weight:500;font-size:.95rem;line-height:1.4}
.dish .ck{position:absolute;top:8px;inset-inline-end:8px;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-fg);
  display:none;place-items:center;font-weight:700}
.dish.on .ck{display:grid}

/* النموذج */
form{display:flex;flex-direction:column;gap:14px}
.seg{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.seg legend{font-weight:500;padding:0;margin-bottom:6px}
.seg-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg-opts label{flex-direction:row;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;background:var(--surface)}
.seg-opts label:has(input:checked){border-color:var(--accent);background:var(--soft);color:var(--accent);font-weight:700}
.seg-opts input{accent-color:var(--accent);margin:0}
#date{text-align:start}
[dir="rtl"] #date{text-align:right}
label{display:flex;flex-direction:column;gap:6px;font-weight:500;min-width:0}
input,textarea{font:inherit;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);width:100%}
.summary{background:var(--soft);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px}
.summary .row{display:flex;justify-content:space-between;gap:12px}
.summary .k{color:var(--muted);flex-shrink:0}
.summary .v{text-align:end;font-weight:500}
.err{color:var(--warn);margin:0}

/* الشريط السفلي */
.bar{position:fixed;inset:auto 0 0;background:var(--surface);border-top:1px solid var(--line);
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bar-in{max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.bar-info{font-size:.95rem;color:var(--muted);min-width:0}
.bar-info b{color:var(--fg)}
.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:12px;padding:12px 22px;font:700 1rem var(--body);cursor:pointer;white-space:nowrap}
.btn:disabled{opacity:.4;cursor:not-allowed}
.ghost{background:none;border:0;color:var(--muted);font:inherit;cursor:pointer;padding:6px 0;margin-bottom:6px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.done{text-align:center;padding-block:60px;display:flex;flex-direction:column;gap:10px;align-items:center}
.done .num{font-family:var(--display);font-weight:800;font-size:2.4rem;color:var(--accent);font-variant-numeric:tabular-nums}

@media (max-width:560px){.dishes{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:420px){.sufras{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="steps" id="steps"><span></span><span></span><span></span></div>
    <div class="langs" id="langs" role="group" aria-label="Language"><button type="button" data-l="ar">عربي</button><button type="button" data-l="en">English</button><button type="button" data-l="ur">اردو</button></div>
  </div>

  <!-- ١: اختيار السفرة -->
  <section id="v1">
    <header>
      <h1 id="brand"></h1>
      <p class="sub" data-t="pickSufra"></p>
    </header>
    <div class="sufras" id="sufras"></div>
  </section>

  <!-- ٢: اختيار الأصناف -->
  <section id="v2" hidden>
    <button class="ghost" type="button" id="back2"></button>
    <header>
      <h1 id="v2title"></h1>
      <p class="sub" id="v2sub"></p>
    </header>
    <div id="cats"></div>
  </section>

  <!-- ٣: البيانات -->
  <section id="v3" hidden>
    <button class="ghost" type="button" data-go="2" data-t="editItems"></button>
    <header><h1 data-t="details"></h1></header>
    <form id="form" novalidate>
      <div class="summary" id="summary"></div>
      <label for="name"><span data-t="name"></span><input id="name" required autocomplete="name"></label>
      <label for="phone"><span data-t="phone"></span><input id="phone" required inputmode="tel" placeholder="05xxxxxxxx" autocomplete="tel" dir="ltr"></label>
      <label for="district"><span data-t="district"></span><input id="district" required autocomplete="address-level3"></label>
      <fieldset class="seg">
        <legend data-t="contact"></legend>
        <div class="seg-opts">
          <label for="c1"><input type="radio" name="contact" id="c1" value="call" checked><span data-t="call"></span></label>
          <label for="c2"><input type="radio" name="contact" id="c2" value="wa"><span data-t="wa"></span></label>
        </div>
      </fieldset>
      <label for="date"><span data-t="date"></span><input id="date" type="date" required dir="ltr"></label>
      <label for="notes"><span data-t="notes"></span><textarea id="notes" rows="2"></textarea></label>
      <p class="err" id="err" hidden></p>
      <button class="btn" id="submit" type="submit" data-t="send"></button>
    </form>
  </section>

  <!-- تم -->
  <section id="v4" class="done" hidden>
    <p class="sub" data-t="orderNo"></p>
    <div class="num" id="orderNo"></div>
    <h1 style="font-size:1.5rem" data-t="thanks"></h1>
    <p class="sub" data-t="willCall"></p>
    <button class="btn" id="again" type="button" data-t="newOrder"></button>
  </section>
</div>

<div class="bar" id="bar">
  <div class="bar-in">
    <div class="bar-info" id="barInfo"></div>
    <button class="btn" id="next" type="button" disabled></button>
  </div>
</div>

const $ = id => document.getElementById(id);
let lang = CONFIG.defaultLang;
try { const s = localStorage.getItem("lang"); if (T[s]) lang = s; } catch {}
const t = k => T[lang][k];
const num = n => Number(n).toLocaleString(lang === "ar" ? "ar-SA" : "en-US");
const sep = () => lang === "en" ? ", " : "، ";
const disc = p => Math.round(p * (100 - CONFIG.discount)) / 100;   // السعر بعد الخصم
const money = p => `${num(p)} ${t("currency")}`;
function totals(){
  const s = CONFIG.sufras[sufra];
  const extras = CONFIG.categories.reduce((a, c, ci) => a + [...picks[ci]].reduce((b, i) => b + (c.items[i].extra || 0), 0), 0);
  const before = (s.price || 0) + extras;
  return { base: s.price || 0, extras, before, after: disc(before) };
}
let step = 1, sufra = null, catIdx = 0;
let picks = CONFIG.categories.map(() => new Set());

(() => { const d = new Date(); d.setDate(d.getDate() + CONFIG.minDaysAhead);
  $("date").min = d.toISOString().slice(0,10); })();

function applyLang(){
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "en" ? "ltr" : "rtl";
  document.title = CONFIG.brand[lang];
  $("brand").textContent = CONFIG.brand[lang];
  document.querySelectorAll("#langs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.l === lang));
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = t(el.dataset.t));
  renderSufras();
  if (step === 2) renderCats();
  if (step === 3) renderSummary();
  updateBar();
}
$("langs").onclick = e => {
  const b = e.target.closest("button[data-l]"); if (!b || b.dataset.l === lang) return;
  lang = b.dataset.l;
  try { localStorage.setItem("lang", lang); } catch {}
  $("err").hidden = true;
  applyLang();
};

function renderSufras(){
  const box = $("sufras"); box.innerHTML = "";
  CONFIG.sufras.forEach((s, i) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "sufra" + (sufra === i ? " on" : "");
    b.setAttribute("aria-pressed", sufra === i);
    b.innerHTML = `<span class="t"></span><span class="ppl"></span><span class="rule"></span>` +
      (s.price != null ? `<span class="pr"><span class="now"></span>${CONFIG.discount ? '<span class="old"></span><span class="badge"></span>' : ""}</span>` : "");
    b.querySelector(".t").textContent = s.name[lang];
    b.querySelector(".ppl").textContent = t("serves")(num(s.min), num(s.max));
    b.querySelector(".rule").textContent = t("rule")(s.picks === 1 ? 1 : num(s.picks));
    if (s.price != null) {
      b.querySelector(".now").textContent = money(disc(s.price));
      if (CONFIG.discount) { b.querySelector(".old").textContent = money(s.price); b.querySelector(".badge").textContent = t("off")(num(CONFIG.discount)); }
    }
    b.onclick = () => {
      if (sufra !== i) picks = picks.map(set => new Set([...set].slice(0, s.picks)));
      sufra = i; renderSufras(); updateBar();
    };
    box.appendChild(b);
  });
}

function renderCats(){
  const s = CONFIG.sufras[sufra], lim = s.picks;
  $("v2title").textContent = s.name[lang];
  $("v2sub").textContent = `${t("catStep")(num(catIdx + 1), num(CONFIG.categories.length))} · ${t("pickRule")(lim === 1 ? 1 : num(lim))}`;
  $("back2").textContent = catIdx > 0 ? t("prevCat") : t("changeSufra");
  const box = $("cats"); box.innerHTML = "";
  CONFIG.categories.forEach((c, ci) => {
    if (ci !== catIdx) return;
    const set = picks[ci], full = set.size >= lim;
    const sec = document.createElement("section"); sec.className = "cat";
    sec.innerHTML = `<div class="cat-h"><h2></h2><span class="pill${full ? " full" : ""}"></span></div><div class="dishes"></div>`;
    sec.querySelector("h2").textContent = c.name[lang];
    sec.querySelector(".pill").textContent = t("of")(num(set.size), num(lim));
    const grid = sec.querySelector(".dishes");
    c.items.forEach((it, ii) => {
      const on = set.has(ii);
      const d = document.createElement("button");
      d.type = "button"; d.className = "dish" + (on ? " on" : "") + (!on && full ? " off" : "");
      d.setAttribute("aria-pressed", on);
      d.innerHTML = (it.img ? `<img class="img" alt="" loading="lazy">` : `<div class="img"></div>`) + `<span class="n"></span><span class="ck">✓</span>`;
      if (it.img) { const im = d.querySelector("img"); im.onerror = () => { const f = document.createElement("div"); f.className = "img"; f.textContent = it[lang].trim()[0]; im.replaceWith(f); }; im.src = it.img; } else d.querySelector(".img").textContent = it[lang].trim()[0];
      d.querySelector(".n").textContent = it[lang];
      if (it.extra) { const ex = document.createElement("span"); ex.className = "ex"; ex.textContent = "+ " + money(disc(it.extra)); d.querySelector(".n").after(ex); }
      d.onclick = () => {
        if (set.has(ii)) set.delete(ii);
        else if (set.size < lim) set.add(ii);
        else if (lim === 1) { set.clear(); set.add(ii); }
        else return;
        renderCats(); updateBar();
      };
      grid.appendChild(d);
    });
    box.appendChild(sec);
  });
}

function catsDone(){
  const lim = CONFIG.sufras[sufra].picks;
  return picks.every(s => CONFIG.requireFull ? s.size === lim : s.size >= 1);
}

function updateBar(){
  const info = $("barInfo"), nx = $("next");
  if (step === 1) {
    info.textContent = sufra == null ? t("chooseSufra") : "";
    if (sufra != null) { const b = document.createElement("b"); b.textContent = CONFIG.sufras[sufra].name[lang]; info.appendChild(b); }
    nx.textContent = t("toItems"); nx.disabled = sufra == null;
  } else if (step === 2) {
    const lim = CONFIG.sufras[sufra].picks, n = picks[catIdx].size;
    info.innerHTML = t("chosen")(num(n), num(lim));
    nx.textContent = t("next");
    nx.disabled = CONFIG.requireFull ? n !== lim : n < 1;
  }
}

function go(n){
  step = n;
  ["v1","v2","v3","v4"].forEach((v, i) => $(v).hidden = i + 1 !== n);
  $("bar").hidden = n > 2;
  [...$("steps").children].forEach((s, i) => s.classList.toggle("on", i < Math.min(n, 3)));
  $("steps").style.visibility = n === 4 ? "hidden" : "visible";
  if (n === 2) renderCats();
  if (n === 3) renderSummary();
  updateBar(); window.scrollTo(0, 0);
}

// اختيارات العميل بلغة معيّنة
function chosen(l){
  const n = l === "ar" ? x => x : num;
  return CONFIG.categories.map((c, ci) => ({ cat: c.name[l], list: [...picks[ci]].map(i => c.items[i][l] + (c.items[i].extra ? ` (+${n(disc(c.items[i].extra))})` : "")) }));
}

function renderSummary(){
  const s = CONFIG.sufras[sufra];
  const box = $("summary"); box.innerHTML = "";
  const add = (k, v) => { const r = document.createElement("div"); r.className = "row";
    r.innerHTML = `<span class="k"></span><span class="v"></span>`;
    r.querySelector(".k").textContent = k; r.querySelector(".v").textContent = v; box.appendChild(r); };
  add(t("sufra"), `${s.name[lang]} (${t("serves")(num(s.min), num(s.max))})`);
  chosen(lang).forEach(x => add(x.cat, x.list.join(sep())));
  if (s.price != null) {
    const tt = totals();
    if (CONFIG.discount) {
      add(t("before"), money(tt.before)); box.lastChild.querySelector(".v").className = "v old";
      add(t("off")(num(CONFIG.discount)), "- " + money(Math.round((tt.before - tt.after) * 100) / 100));
      add(t("total"), money(tt.after));
    } else add(t("price"), money(tt.before));
    box.lastChild.classList.add("total");
  }
}

$("next").onclick = () => {
  if (step === 1) { catIdx = 0; go(2); return; }
  if (step === 2 && catIdx < CONFIG.categories.length - 1) { catIdx++; renderCats(); updateBar(); window.scrollTo(0, 0); return; }
  if (step === 2 && !catsDone()) return;
  go(step + 1);
};
$("back2").onclick = () => {
  if (catIdx > 0) { catIdx--; renderCats(); updateBar(); window.scrollTo(0, 0); }
  else go(1);
};
document.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(+b.dataset.go));
$("again").onclick = () => { sufra = null; catIdx = 0; picks = CONFIG.categories.map(() => new Set()); $("form").reset(); renderSufras(); go(1); };

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  const v = id => $(id).value.trim();
  const err = $("err"); err.hidden = true;
  const fail = m => { err.textContent = m; err.hidden = false; };
  if (!v("name") || !v("phone")) return fail(t("eNamePhone"));
  if (!/^[0-9+\s]{9,15}$/.test(v("phone"))) return fail(t("ePhone"));
  if (!v("district")) return fail(t("eDistrict"));
  if (!v("date")) return fail(t("eDate"));
  if (v("date") < $("date").min) return fail(t("eSoon")(CONFIG.minDaysAhead));

  // الإيميل يوصلك بالعربي دائماً
  const s = CONFIG.sufras[sufra];

    "السفرة": `${s.name.ar} (تكفي ${s.min} - ${s.max} أشخاص)`,
  };
  chosen("ar").forEach(x => payload[x.cat] = x.list.join("، "));
  if (s.price != null) {
    const tt = totals();
    payload["السعر قبل الخصم"] = `${tt.before} ريال` + (tt.extras ? ` (السفرة ${tt.base} + زيادات ${tt.extras})` : "");
    if (CONFIG.discount) payload["الخصم"] = `${CONFIG.discount}٪ (- ${Math.round((tt.before - tt.after) * 100) / 100} ريال)`;
    payload["الإجمالي"] = `${tt.after} ريال`;
  }
  Object.assign(payload, {
    "الاسم": v("name"), "الجوال": v("phone"), "الحي": v("district"),
    "طريقة التواصل": document.querySelector('input[name="contact"]:checked').value === "wa" ? "واتساب" : "اتصال",
    "التاريخ": v("date"), "ملاحظات": v("notes") || "-",
    "لغة العميل": { ar: "عربي", en: "English", ur: "أوردو" }[lang]
  });

  // نفس الطلب لشاشة الكاشير (Google Sheet)
  const tt = s.price != null ? totals() : null;
  const order = {
    id: orderNo,
    sufra: `${s.name.ar} (تكفي ${s.min} - ${s.max} أشخاص)`,
    items: chosen("ar").map(x => `${x.cat}: ${x.list.join("، ")}`).join("\n"),
    total: tt ? `${tt.after} ريال` + (CONFIG.discount ? ` (قبل الخصم ${tt.before})` : "") : "-",
    name: v("name"), phone: v("phone"), district: v("district"),
    contact: payload["طريقة التواصل"], date: v("date"),
    notes: v("notes"), lang: payload["لغة العميل"]
  };

  const sendEmail = async () => {
    const res = await fetch("https://formsubmit.co/ajax/" + CONFIG.email, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify(payload)
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || data.success === "false" || data.success === false) throw new Error("email");
  };
  const sendSheet = async () => {
    const res = await fetch(CONFIG.sheetUrl, { method: "POST", body: JSON.stringify({ order }) });  // text/plain بدون preflight
    const data = await res.json();
    if (!data.ok) throw new Error("sheet");
  };

  const jobs = [];
  if (CONFIG.sheetUrl) jobs.push(sendSheet());
  if (CONFIG.email && CONFIG.email !== "your@email.com") jobs.push(sendEmail());

  const btn = $("submit"); btn.disabled = true; btn.textContent = t("sending");
  try {
    if (!jobs.length) throw new Error("no_target");
    const results = await Promise.allSettled(jobs);
    if (!results.some(x => x.status === "fulfilled")) throw new Error("all_failed");
    $("orderNo").textContent = "#" + orderNo;
    go(4);
  } catch {
    fail(t("eSend"));
  } finally { btn.disabled = false; btn.textContent = t("send"); }
});

applyLang(); go(1);
</script>
</body>
</html>
