<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>شاشة الكاشير | الجاذرينج</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
<style>
/* Layout: top bar with status tabs, order cards grid, newest first */
:root{
  --bg:#F7F3F3; --surface:#FFFFFF; --fg:#2A1414; --muted:#7A6666;
  --line:#EBDDDD; --accent:#801919; --accent-fg:#FFFFFF; --soft:#F8EEEE;
  --new:#801919; --ok:#1F6F43; --ready:#9A6A00; --done:#5E6670; --cancel:#B23A3A;
  --font:"Tajawal",Tahoma,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1200px;margin:0 auto;padding-block:18px 40px}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* دخول */
.login{max-width:380px;margin:12vh auto 0;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px;display:flex;flex-direction:column;gap:14px}
.login h1{margin:0;font-size:1.5rem;font-weight:800}
.login input{font:inherit;padding:12px;border:1px solid var(--line);border-radius:10px;width:100%}
.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:10px;padding:12px 18px;font-weight:700}
.err{color:var(--cancel);margin:0}
.muted{color:var(--muted);margin:0;font-size:.9rem}

/* الشريط */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.top h1{margin:0;font-size:1.4rem;font-weight:800}
.live{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.9rem}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok)}
.dot.off{background:var(--cancel)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.tabs button{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:600;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.tabs .n{font-variant-numeric:tabular-nums;margin-inline-start:4px;opacity:.8}
.ghost{background:none;border:1px solid var(--line);border-radius:10px;padding:6px 12px;color:var(--muted)}

/* الطلبات */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;
  border-inline-start:5px solid var(--st,var(--line));min-width:0}
.card.fresh{animation:pulse 1.4s ease-in-out 3}
@keyframes pulse{50%{box-shadow:0 0 0 6px var(--soft)}}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.no{font-size:1.3rem;font-weight:800;font-variant-numeric:tabular-nums}
.when{color:var(--muted);font-size:.82rem}
.pill{font-size:.8rem;font-weight:700;border-radius:999px;padding:2px 10px;color:#fff;background:var(--st);white-space:nowrap}
.date{background:var(--soft);border-radius:10px;padding:8px 10px;display:flex;justify-content:space-between;gap:8px;font-weight:700}
.date span:first-child{color:var(--muted);font-weight:500}
.sufra{font-weight:700}
.items{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:.92rem}
.items b{color:var(--muted);font-weight:500}
.total{font-weight:800;font-variant-numeric:tabular-nums}
.cust{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.cust .row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.phone{font-variant-numeric:tabular-nums;direction:ltr;font-weight:700}
.pref{font-size:.8rem;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted)}
.link{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;padding:4px 10px;color:var(--fg);text-decoration:none;font-size:.88rem;font-weight:600}
.link.wa{border-color:#25D366;color:#13863F}
.notes{background:#FFF8E6;border-radius:8px;padding:6px 10px;font-size:.9rem}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.acts button{flex:1;min-width:80px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px;font-weight:700;color:var(--fg)}
.acts button.main{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.acts button:disabled{opacity:.5;cursor:wait}
.views{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:16px;width:fit-content;max-width:100%}
.views button{border:0;background:none;border-radius:9px;padding:8px 18px;font-weight:700;color:var(--muted)}
.views button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.mcat{margin-bottom:22px}
.mcat-h{display:flex;align-items:baseline;gap:10px;margin:0 0 10px}
.mcat-h h2{margin:0;font-size:1.15rem;font-weight:800}
.mitems{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.mitem{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:start;color:var(--fg);min-width:0}
.mitem span:first-child{min-width:0;overflow-wrap:anywhere}
.mitem .st{flex-shrink:0;font-size:.78rem;font-weight:700;border-radius:999px;padding:2px 10px;background:#E6F2EA;color:var(--ok)}
.mitem.is-off{background:var(--soft);border-color:var(--cancel)}
.mitem.is-off span:first-child{text-decoration:line-through;color:var(--muted)}
.mitem.is-off .st{background:var(--cancel);color:#fff}
.mitem:disabled{cursor:wait}
.empty{text-align:center;color:var(--muted);padding:60px 10px;background:var(--surface);border:1px dashed var(--line);border-radius:16px}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));inset-inline-start:max(16px,env(safe-area-inset-left,0px));
  background:var(--fg);color:#fff;border-radius:10px;padding:10px 16px;font-weight:600}
@media (max-width:420px){.grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.card.fresh{animation:none}}
</style>
</head>
<body>
<div class="wrap">

  <!-- الدخول -->
  <form class="login" id="login">
    <h1>شاشة الكاشير</h1>
    <p class="muted">اكتب كلمة السر عشان تشوف الطلبات</p>
    <label for="key" hidden>كلمة السر</label>
    <input id="key" type="password" autocomplete="current-password" placeholder="كلمة السر" required>
    <p class="err" id="loginErr" hidden></p>
    <button class="btn" type="submit" id="loginBtn">دخول</button>
  </form>

  <!-- اللوحة -->
  <main id="board" hidden>
    <div class="top">
      <h1>طلبات الجاذرينج</h1>
      <div class="live"><span class="dot" id="dot"></span><span id="liveTxt">متصل</span>
        <button class="ghost" id="notif" type="button" hidden>🖥️ تفعيل إشعارات الجهاز</button>
        <button class="ghost" id="testSound" type="button">🔊 تجربة الصوت</button>
        <button class="ghost" id="sound" type="button">🔔 الصوت شغال</button>
        <button class="ghost" id="logout" type="button">خروج</button>
      </div>
    </div>
    <div class="views" id="views" role="group" aria-label="القسم">
      <button type="button" data-v="orders" aria-pressed="true">الطلبات</button>
      <button type="button" data-v="menu" aria-pressed="false">الأصناف</button>
    </div>
    <section id="ordersView">
      <div class="tabs" id="tabs"></div>
      <div class="grid" id="grid"></div>
    </section>
    <section id="menuView" hidden>
      <p class="muted" style="margin-bottom:14px">اضغط على الصنف عشان توقفه أو ترجّعه. الصنف الموقوف يطلع للعميل "غير متوفر" وما يقدر يختاره. التغيير يوصل للعملاء على طول.</p>
      <div id="menuList"></div>
    </section>
  </main>
</div>
<div class="toast" id="toast" hidden></div>

<script src="menu.js"></script>
<script>
/* =========================================================
   الصق هنا نفس رابط Apps Script اللي في صفحة الطلب
   ========================================================= */
const SHEET_URL = "https://script.google.com/macros/s/AKfycbyGimoaxSwpu1y9iFXEbNJ3DSILaqoTLYFRD0UN000ylV0mawavoM2142TqhYFZXB8/exec";
const REFRESH_SECONDS = 15;
/* ========================================================= */

const $ = id => document.getElementById(id);
const COLORS = { "جديد":"var(--new)", "مؤكد":"var(--ok)", "جاهز":"var(--ready)", "تم التسليم":"var(--done)", "ملغي":"var(--cancel)" };
const NEXT = { "جديد":"مؤكد", "مؤكد":"جاهز", "جاهز":"تم التسليم" };
const NEXT_LABEL = { "جديد":"قبول الطلب", "مؤكد":"جاهز", "جاهز":"تم التسليم" };
const TABS = [
  { id:"new", label:"جديد", f:o => o.status === "جديد" },
  { id:"work", label:"قيد التنفيذ", f:o => o.status === "مؤكد" || o.status === "جاهز" },
  { id:"done", label:"منتهية", f:o => o.status === "تم التسليم" || o.status === "ملغي" },
  { id:"all", label:"الكل", f:() => true },
];

let OFF = new Set(), view = "orders", savingAvail = false, availVer = 0;
let alarm = null, key = "", orders = [], seen = null, tab = "new", soundOn = true, timer = null, busy = {};
try { key = localStorage.getItem("cashierKey") || ""; soundOn = localStorage.getItem("cashierSound") !== "off"; } catch {}

function toast(m){ const t = $("toast"); t.textContent = m; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 3000); }

// صوت التنبيه
let ctx = null;
// نغمة إنذار عالية: نغمتين متناوبتين (عالي/واطي) مثل جرس الطلبات، تتكرر ٣ مرات
let master = null;
function beep(){
  if (!soundOn) return;
  try {
    ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
    if (!master) {
      // ضاغط + تكبير عشان الصوت يطلع أعلى بدون تشويش
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -10; comp.knee.value = 0; comp.ratio.value = 12; comp.attack.value = 0.002; comp.release.value = 0.1;
      master = ctx.createGain(); master.gain.value = 1.6;
      master.connect(comp); comp.connect(ctx.destination);
    }
    const t0 = ctx.currentTime + 0.02;
    const notes = [1319, 988, 1319, 988, 1319, 988];   // E6 / B5
    notes.forEach((f, k) => {
      const at = t0 + k * 0.16;
      [1, 2].forEach((mult, layer) => {               // نغمة أساسية + أوكتاف أعلى عشان تخترق الضجة
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = layer ? "triangle" : "square";
        o.frequency.setValueAtTime(f * mult, at);
        o.connect(g); g.connect(master);
        const peak = layer ? 0.25 : 0.55;
        g.gain.setValueAtTime(0.0001, at);
        g.gain.exponentialRampToValueAtTime(peak, at + 0.01);
        g.gain.setValueAtTime(peak, at + 0.11);
        g.gain.exponentialRampToValueAtTime(0.0001, at + 0.15);
        o.start(at); o.stop(at + 0.16);
      });
    });
  } catch {}
}

// التنبيه يتكرر كل ثانيتين لين ما يبقى أي طلب جديد (قبول أو رفض)
// إشعار الجهاز: يطلع حتى لو الكاشير في تبويب أو برنامج ثاني
const canNotify = "Notification" in window;
function updateNotifBtn(){
  const b = $("notif");
  if (!canNotify || Notification.permission === "denied") { b.hidden = !canNotify ? true : false; b.textContent = "🖥️ الإشعارات محظورة من المتصفح"; b.disabled = true; if (!canNotify) b.hidden = true; return; }
  b.hidden = Notification.permission === "granted";
}
async function askNotify(){
  if (!canNotify || Notification.permission !== "default") return;
  try { await Notification.requestPermission(); } catch {}
  updateNotifBtn();
}
function sysNotify(o){
  if (!canNotify || Notification.permission !== "granted") return;
  try {
    const n = new Notification("طلب جاذرينج جديد #" + o.id, {
      body: `${o.sufra}\n${o.name} · ${prettyDate(o.date)}\n${o.total || ""}`,
      tag: "order-" + o.id, requireInteraction: true
    });
    n.onclick = () => { window.focus(); tab = "new"; render(); n.close(); };
  } catch {}
}

// عنوان التبويب يومض لين يرد الكاشير
let blink = null;
function syncBlink(pending){
  if (pending && !blink) { let on = false; blink = setInterval(() => { on = !on; document.title = on ? "🔴 طلب جديد!" : `(${pending}) شاشة الكاشير`; }, 1000); }
  if (!pending && blink) { clearInterval(blink); blink = null; document.title = "شاشة الكاشير | الجاذرينج"; }
}

function syncAlarm(){
  const pending = orders.some(o => o.status === "جديد");
  syncBlink(orders.filter(o => o.status === "جديد").length);
  if (pending && soundOn) { if (!alarm) { beep(); alarm = setInterval(beep, 2000); } }
  else { clearInterval(alarm); alarm = null; }
}

async function load(){
  if (!SHEET_URL) throw new Error("no_url");
  const v = availVer;
  const res = await fetch(SHEET_URL + "?key=" + encodeURIComponent(key) + "&t=" + Date.now());
  const data = await res.json();
  if (!data.ok) throw new Error(data.error || "fail");
  if (Array.isArray(data.off) && !savingAvail && v === availVer) {
    const next = new Set(data.off);
    const same = next.size === OFF.size && [...next].every(x => OFF.has(x));
    if (!same) { OFF = next; if (view === "menu") renderMenu(); }
  }
  return data.orders || [];
}

async function refresh(){
  try {
    const list = await load();
    const ids = new Set(list.map(o => o.id));
    const fresh = seen ? list.filter(o => !seen.has(o.id) && o.status === "جديد") : [];
    seen = ids; orders = list;
    $("dot").classList.remove("off"); $("liveTxt").textContent = "متصل · آخر تحديث " + new Date().toLocaleTimeString("ar-SA-u-ca-gregory-nu-latn", { hour:"numeric", minute:"2-digit" });
    if (fresh.length) { fresh.forEach(sysNotify); toast(fresh.length === 1 ? "طلب جديد #" + fresh[0].id : fresh.length + " طلبات جديدة"); }
    render(new Set(fresh.map(o => o.id)));
    syncAlarm();
  } catch (e) {
    if (e.message === "key") { logout(); $("loginErr").textContent = "كلمة السر غلط."; $("loginErr").hidden = false; return; }
    $("dot").classList.add("off"); $("liveTxt").textContent = "غير متصل، بنحاول مرة ثانية";
  }
}

function ago(iso){
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (isNaN(m)) return "";
  if (m < 1) return "الحين";
  if (m < 60) return `قبل ${m} دقيقة`;
  if (m < 1440) return `قبل ${Math.round(m / 60)} ساعة`;
  return new Date(iso).toLocaleDateString("ar-SA-u-ca-gregory-nu-latn", { day:"numeric", month:"short", hour:"numeric", minute:"2-digit" });
}
function prettyDate(d){
  const x = new Date(d + "T12:00:00");
  return isNaN(x) ? d : x.toLocaleDateString("ar-SA-u-ca-gregory-nu-latn", { weekday:"long", day:"numeric", month:"long" });
}
function waNumber(p){
  let n = String(p).replace(/\D/g, "");
  if (n.startsWith("05")) n = "966" + n.slice(1);
  else if (n.startsWith("5") && n.length === 9) n = "966" + n;
  return n;
}
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };

function render(freshIds = new Set()){
  // التبويبات
  const tabs = $("tabs"); tabs.innerHTML = "";
  TABS.forEach(tb => {
    const b = el("button"); b.type = "button"; b.setAttribute("aria-pressed", tb.id === tab);
    b.append(tb.label, el("span", "n", String(orders.filter(tb.f).length)));
    b.onclick = () => { tab = tb.id; render(); };
    tabs.appendChild(b);
  });

  const grid = $("grid"); grid.innerHTML = "";
  const list = orders.filter(TABS.find(x => x.id === tab).f);
  if (!list.length) { grid.appendChild(el("div", "empty", tab === "new" ? "ما فيه طلبات جديدة. أول ما يوصل طلب بيطلع هنا مع صوت تنبيه." : "ما فيه طلبات هنا.")); return; }

  list.forEach(o => {
    const c = el("article", "card" + (freshIds.has(o.id) ? " fresh" : ""));
    c.style.setProperty("--st", COLORS[o.status] || "var(--line)");

    const head = el("div", "head");
    const hl = el("div"); hl.append(el("div", "no", "#" + o.id), el("div", "when", ago(o.time)));
    head.append(hl, el("span", "pill", o.status || "جديد"));

    // الحي: من عمود الحي، أو من أول سطر في الملاحظات (كود الشيت القديم)
    let district = o.district || "", notes = String(o.notes || "");
    const dm = notes.match(/^📍 الحي: ([^\n]*)\n?/);
    if (dm) { if (!district) district = dm[1].trim(); notes = notes.slice(dm[0].length).trim(); }
    const date = el("div", "date"); date.append(el("span", null, "تاريخ الجاذرينج"), el("span", null, prettyDate(o.date)));
    const dist = el("div", "date"); dist.append(el("span", null, "📍 الحي"), el("span", null, district || "-"));

    const items = el("ul", "items");
    String(o.items || "").split("\n").filter(Boolean).forEach(line => {
      const li = el("li"); const i = line.indexOf(":");
      if (i > 0) { li.append(el("b", null, line.slice(0, i + 1) + " "), line.slice(i + 1).trim()); } else li.textContent = line;
      items.appendChild(li);
    });

    const cust = el("div", "cust");
    const r1 = el("div", "row"); r1.append(el("strong", null, o.name || "-"));
    r1.append(el("span", "pref", "يفضّل: " + (o.contact || "-")));
    if (o.lang && o.lang !== "عربي") r1.append(el("span", "pref", o.lang));
    const r2 = el("div", "row");
    const ph = el("span", "phone", o.phone);
    const call = el("a", "link", "اتصال"); call.href = "tel:" + String(o.phone).replace(/\s/g, "");
    const wa = el("a", "link wa", "واتساب"); wa.href = "https://wa.me/" + waNumber(o.phone) + "?text=" + encodeURIComponent(`هلا ${o.name}، نتواصل معك بخصوص طلب الجاذرينج رقم #${o.id}`); wa.target = "_blank"; wa.rel = "noopener";
    r2.append(ph, call, wa);
    cust.append(r1, r2);
    if (notes) cust.append(el("div", "notes", "ملاحظات: " + notes));

    const acts = el("div", "acts");
    if (NEXT[o.status]) { const b = el("button", "main", NEXT_LABEL[o.status]); b.type = "button"; b.onclick = () => setStatus(o, NEXT[o.status], b); acts.append(b); }
    if (o.status !== "ملغي" && o.status !== "تم التسليم") { const lbl = o.status === "جديد" ? "رفض" : "إلغاء"; const b = el("button", null, lbl); b.type = "button"; b.dataset.lbl = lbl; b.onclick = () => confirmCancel(o, b); acts.append(b); }
    if (o.status === "ملغي" || o.status === "تم التسليم") { const b = el("button", null, "إرجاع لجديد"); b.type = "button"; b.onclick = () => setStatus(o, "جديد", b); acts.append(b); }

    c.append(head, date, dist, el("div", "sufra", o.sufra), items, el("div", "total", "الإجمالي: " + (o.total || "-")), cust, acts);
    grid.appendChild(c);
  });
}

function confirmCancel(o, b){
  if (b.dataset.sure) return setStatus(o, "ملغي", b);
  b.dataset.sure = "1"; b.textContent = "متأكد؟ اضغط مرة ثانية";
  setTimeout(() => { if (b.isConnected) { delete b.dataset.sure; b.textContent = b.dataset.lbl; } }, 4000);
}

async function setStatus(o, status, b){
  if (busy[o.id]) return; busy[o.id] = true;
  b.disabled = true;
  try {
    const res = await fetch(SHEET_URL, { method:"POST", body: JSON.stringify({ action:"status", key, id:o.id, status }) });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error);
    o.status = status; render(); syncAlarm(); toast(`الطلب #${o.id}: ${status}`);
  } catch { toast("ما قدرنا نحدّث الطلب، جرّب مرة ثانية"); b.disabled = false; }
  finally { busy[o.id] = false; }
}

function start(){
  updateNotifBtn();
  $("login").hidden = true; $("board").hidden = false;
  $("sound").textContent = soundOn ? "🔔 الصوت شغال" : "🔕 الصوت مطفي";
  refresh(); clearInterval(timer); timer = setInterval(refresh, REFRESH_SECONDS * 1000);
}
function logout(){
  clearInterval(timer); clearInterval(alarm); alarm = null; syncBlink(0); key = ""; seen = null; orders = [];
  try { localStorage.removeItem("cashierKey"); } catch {}
  $("board").hidden = true; $("login").hidden = false;
}

$("login").addEventListener("submit", async e => {
  e.preventDefault();
  const err = $("loginErr"); err.hidden = true;
  if (!SHEET_URL) { err.textContent = "ما انحط رابط Apps Script في الملف للحين."; err.hidden = false; return; }
  key = $("key").value.trim(); if (!key) return;
  try { ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); ctx.resume(); } catch {}  // يفتح الصوت بعد ضغطة المستخدم
  askNotify();
  $("loginBtn").disabled = true;
  try { await load(); try { localStorage.setItem("cashierKey", key); } catch {} start(); }
  catch (x) { err.textContent = x.message === "key" ? "كلمة السر غلط." : "ما قدرنا نتصل، تأكد من الإنترنت."; err.hidden = false; }
  finally { $("loginBtn").disabled = false; }
});
$("logout").onclick = logout;
$("testSound").onclick = () => {
  try { ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); ctx.resume(); } catch {}
  const was = soundOn; soundOn = true; beep(); soundOn = was;
};

// ===== الأصناف المتوفرة =====
function renderMenu(){
  const box = $("menuList"); box.innerHTML = "";
  if (typeof MENU_CATEGORIES === "undefined") { box.appendChild(el("div", "empty", "ما قدرنا نحمّل قائمة الأصناف.")); return; }
  MENU_CATEGORIES.forEach(c => {
    const sec = el("section", "mcat");
    const h = el("div", "mcat-h"); const offN = c.items.filter(it => OFF.has(it.ar)).length;
    h.append(el("h2", null, c.name.ar), el("span", "muted", offN ? `${offN} غير متوفر` : "كلها متوفرة"));
    const grid = el("div", "mitems");
    c.items.forEach(it => {
      const off = OFF.has(it.ar);
      const b = el("button", "mitem" + (off ? " is-off" : "")); b.type = "button";
      b.setAttribute("aria-pressed", String(!off));
      b.append(el("span", null, it.ar), el("span", "st", off ? "غير متوفر" : "متوفر"));
      b.onclick = () => toggleItem(it.ar);
      grid.appendChild(b);
    });
    sec.append(h, grid); box.appendChild(sec);
  });
}
async function toggleItem(name){
  if (savingAvail) return;
  availVer++;
  const before = new Set(OFF);
  if (OFF.has(name)) OFF.delete(name); else OFF.add(name);
  savingAvail = true; renderMenu();
  document.querySelectorAll(".mitem").forEach(b => b.disabled = true);
  try {
    const res = await fetch(SHEET_URL, { method: "POST", body: JSON.stringify({ action: "avail", key, off: [...OFF] }) });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error);
    toast(OFF.has(name) ? `${name}: غير متوفر` : `${name}: رجع متوفر`);
  } catch { OFF = before; toast("ما قدرنا نحفظ التغيير، جرّب مرة ثانية"); }
  finally { availVer++; savingAvail = false; renderMenu(); }
}
$("views").onclick = e => {
  const b = e.target.closest("button[data-v]"); if (!b) return;
  view = b.dataset.v;
  document.querySelectorAll("#views button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  $("ordersView").hidden = view !== "orders"; $("menuView").hidden = view !== "menu";
  if (view === "menu") renderMenu();
};
$("notif").onclick = askNotify;
$("sound").onclick = () => {
  soundOn = !soundOn; try { localStorage.setItem("cashierSound", soundOn ? "on" : "off"); } catch {}
  $("sound").textContent = soundOn ? "🔔 الصوت شغال" : "🔕 الصوت مطفي";
  if (soundOn) { try { ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); ctx.resume(); } catch {} }
  clearInterval(alarm); alarm = null; syncAlarm();
};
// تحديث "قبل كم دقيقة"
setInterval(() => { if (!$("board").hidden) render(); }, 60000);

// المتصفح ما يشغّل الصوت إلا بعد أول ضغطة في الصفحة
document.addEventListener("pointerdown", () => { try { ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); ctx.resume(); } catch {} }, { once: true });
if (key && SHEET_URL) start();
</script>
</body>
</html>
